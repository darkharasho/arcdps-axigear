name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      XWIN_ACCEPT_LICENSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The MSVC STL headers cargo-xwin fetches require clang >= 19.
      - run: |
          sudo apt-get update && sudo apt-get install -y clang-19 lld-19 llvm-19
          echo /usr/lib/llvm-19/bin >> "$GITHUB_PATH"
      - run: cargo install cargo-xwin --locked
      - run: cargo xwin check -p arcdps_axigear --target x86_64-pc-windows-msvc
