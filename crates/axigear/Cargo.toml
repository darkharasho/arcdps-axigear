[package]
name = "arcdps_axigear"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axigear-core = { path = "../axigear-core" }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
semver = "1"

[target.'cfg(windows)'.dependencies]
arcdps = { path = "../../vendor/arcdps", features = ["extras", "log"] }
evtc = { path = "../../vendor/evtc", features = ["realtime"] }
# Private per-thread heaps: the default allocator contends the shared process
# heap lock with GW2's render thread under Wine (see arcdps-axipulse).
mimalloc = { version = "0.1", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"
